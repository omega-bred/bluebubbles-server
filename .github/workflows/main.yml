name: Build-and-Test-BlueBubbles-Server

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Setup Node.js 20.11
        uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build UI and Server
        run: |
          npm run build-ui
          npm --workspace @bluebubbles/server run build
      - name: Type-check Server
        run: ./packages/server/node_modules/.bin/tsc -p packages/server/tsconfig.json --noEmit
      - name: Test Hardened MCP Endpoints
        run: ./node_modules/.bin/jest --config packages/server/jest.mcp.config.js --runInBand
